name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache Buildozer
        uses: actions/cache@v4
        with:
          path: ~/.buildozer
          key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: ${{ runner.os }}-buildozer-

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y -qq libffi-dev libssl-dev autoconf libtool \
            pkg-config libltdl-dev libsqlite3-dev zlib1g-dev libbz2-dev \
            libncurses-dev libncursesw5-dev libtinfo-dev libxml2-dev \
            libxslt1-dev libpangocairo-1.0-0
          pip install buildozer cython==0.29.36

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log
        env:
          GRADLE_OPTS: "-Xmx4g"

      - name: Find APK
        run: |
          mkdir -p bin
          find . -name "*.apk" -type f -exec cp {} bin/ \;
          ls -la bin/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IVDripCalculator-APK
          path: bin/*.apk
          if-no-files-found: warn